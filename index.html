<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Container Arrival Tracker</title>
  <script src="./supabase-config.js"></script>
  <style>
    :root {
      --bg: #0b1320;
      --panel: #111d2d;
      --panel-2: #15283d;
      --line: #22354b;
      --text: #edf5ff;
      --muted: #9bb0c8;
      --primary: #4da3ff;
      --success: #2ec27e;
      --warn: #f0b429;
      --danger: #ef6b6b;
      --shadow: rgba(0,0,0,0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .login-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 13, 20, 0.84);
      z-index: 50;
    }
    .login-box {
      width: min(92vw, 320px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 12px 30px var(--shadow);
    }
    .login-title {
      margin: 0 0 14px;
      font-size: 1.1rem;
      text-align: center;
    }
    input, button, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 14px;
      margin-top: 8px;
    }
    input {
      background: #09131d;
      color: var(--text);
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      min-height: 18px;
      margin-top: 8px;
      color: #ff8e8e;
      font-size: 12px;
    }
    .app {
      display: none;
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2vw, 2.3rem);
    }
    .sync-badge {
      display: inline-block;
      background: #1a2d22;
      color: #68e1a4;
      border: 1px solid #2c4d38;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    .card .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .card .value {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar input, .toolbar select {
      width: auto;
      flex: 1 1 180px;
      min-width: 150px;
    }
    .table-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    th {
      background: #122333;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    tbody tr:hover {
      background: rgba(255,255,255,0.02);
    }
    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .status.completed { background: rgba(46,194,126,0.15); color: #72efb4; }
    .status.progress { background: rgba(240,180,41,0.14); color: #ffd77a; }
    .status.awaiting { background: rgba(157,176,200,0.12); color: #bfd0ed; }
    .muted { color: var(--muted); }
    .btn { background: var(--panel-2); color: var(--text); }
    .btn.danger { background: #7d2f2f; }
    .btn.success { background: #1e6e53; }
    .row-actions {
      display: flex;
      gap: 8px;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.58);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }
    .modal.open {
      display: flex;
    }
    .modal-box {
      width: min(92vw, 520px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .field.full { grid-column: 1 / -1; }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    @media (max-width: 640px) {
      .modal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="passwordGate" class="login-wrap">
    <div class="login-box">
      <h2 class="login-title">Container Tracker — Login</h2>
      <input id="pwInput" type="password" placeholder="Enter password" />
      <button id="pwBtn">Enter</button>
      <div id="pwError" class="error"></div>
    </div>
  </div>

  <div id="app" class="app">
    <div class="topbar">
      <h1>Container Arrival Tracker</h1>
      <span id="syncBadge" class="sync-badge">Local storage</span>
    </div>

    <div class="cards">
      <div class="card"><div class="label">Total</div><div id="totalCount" class="value">0</div></div>
      <div class="card"><div class="label">Completed</div><div id="completedCount" class="value">0</div></div>
      <div class="card"><div class="label">In progress</div><div id="progressCount" class="value">0</div></div>
      <div class="card"><div class="label">Delayed</div><div id="delayedCount" class="value">0</div></div>
    </div>

    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Search BL, container, brand..." />
      <select id="filterStatus">
        <option value="">All status</option>
        <option value="Completed">Completed</option>
        <option value="In progress">In progress</option>
        <option value="Awaiting dates">Awaiting dates</option>
      </select>
      <button id="addBtn" class="btn success">+ Add container</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>BL</th>
            <th>Brand</th>
            <th>Container</th>
            <th>Warehouse</th>
            <th>Arrival</th>
            <th>Discharge</th>
            <th>Out</th>
            <th>Status</th>
            <th>Delay</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-box">
      <h3 id="modalTitle">Add container</h3>
      <div class="modal-grid">
        <div class="field"><label>BL No.</label><input id="f_bl" type="text" /></div>
        <div class="field"><label>Container No.</label><input id="f_container" type="text" /></div>
        <div class="field"><label>Brand</label><input id="f_brand" type="text" /></div>
        <div class="field"><label>Warehouse</label><input id="f_location" type="text" /></div>
        <div class="field"><label>Arrival</label><input id="f_arrival" type="date" /></div>
        <div class="field"><label>Discharge</label><input id="f_discharge" type="date" /></div>
        <div class="field"><label>Out</label><input id="f_out" type="date" /></div>
        <div class="field"><label>LTA status</label><input id="f_req" type="text" placeholder="Request Done" /></div>
      </div>
      <div class="actions">
        <button id="deleteBtn" class="btn danger" style="display:none;">Delete</button>
        <button id="cancelBtn" class="btn">Cancel</button>
        <button id="saveBtn" class="btn success">Save</button>
      </div>
    </div>
  </div>

  <script>
    const BASE_ROWS = [
      { bl: 'MEDUXW386932', brand: 'AMICA GOLD', container: 'MSNU1360212', location: 'HINO 1-2', arrival: '2026-08-13', discharge: '2026-08-13', out: '2026-08-15', req_status: 'Request Done' },
      { bl: 'ABCD123456', brand: 'AMICA GOLD', container: 'MSNU2345678', location: 'HINO 1', arrival: '2026-08-15', discharge: '2026-08-18', out: '', req_status: '' },
      { bl: 'ZWXY987654', brand: 'NEXUS', container: 'TCLU9090909', location: 'HINO 1-2', arrival: '2026-08-10', discharge: '2026-08-12', out: '2026-08-17', req_status: 'Approved' }
    ];

    const DELAY_LIMIT = 4;
    let userEdits = {};
    let userAdds = [];
    let userDeletes = {};

    function getStatus(row) {
      if (row.out) return 'Completed';
      if (row.arrival) return 'In progress';
      return 'Awaiting dates';
    }

    function daysBetween(a, b) {
      if (!a || !b) return null;
      const d1 = new Date(a);
      const d2 = new Date(b);
      if (Number.isNaN(d1.getTime()) || Number.isNaN(d2.getTime())) return null;
      return Math.round((d2 - d1) / 86400000);
    }

    function readLocal() {
      try {
        const edits = JSON.parse(localStorage.getItem('cat_edits') || '{}');
        const adds = JSON.parse(localStorage.getItem('cat_adds') || '[]');
        const dels = JSON.parse(localStorage.getItem('cat_deletes') || '{}');
        userEdits = edits;
        userAdds = adds;
        userDeletes = dels;
      } catch (e) {
        userEdits = {};
        userAdds = [];
        userDeletes = {};
      }
    }

    async function loadRemote() {
      try {
        const data = await window.loadTrackerCloudData();
        if (data && data.user_edits) userEdits = data.user_edits || {};
        if (data && data.user_adds) userAdds = data.user_adds || [];
        if (data && data.user_deletes) userDeletes = data.user_deletes || {};
      } catch (e) {
        console.log('Cloud sync unavailable, using local data');
      }
    }

    function saveLocal() {
      localStorage.setItem('cat_edits', JSON.stringify(userEdits));
      localStorage.setItem('cat_adds', JSON.stringify(userAdds));
      localStorage.setItem('cat_deletes', JSON.stringify(userDeletes));
    }

    async function persist() {
      saveLocal();
      setSyncStatus('syncing');
      try {
        if (window.saveTrackerCloudData) {
          await window.saveTrackerCloudData({
            userEdits,
            userAdds,
            userDeletes
          });
        }
        setSyncStatus('synced');
      } catch (e) {
        setSyncStatus('local');
      }
    }

    function setSyncStatus(type) {
      const badge = document.getElementById('syncBadge');
      if (type === 'syncing') {
        badge.textContent = '↻ Syncing...';
        badge.style.background = '#392d1d';
        badge.style.color = '#f0c872';
        badge.style.borderColor = '#544426';
      } else if (type === 'synced') {
        badge.textContent = '✓ Synced';
        badge.style.background = '#1d3629';
        badge.style.color = '#7ef0b3';
        badge.style.borderColor = '#2d4b38';
      } else {
        badge.textContent = 'Local storage';
        badge.style.background = '#1a2d22';
        badge.style.color = '#68e1a4';
        badge.style.borderColor = '#2c4d38';
      }
    }

    function buildRows() {
      const rows = [];
      BASE_ROWS.forEach((row, index) => rows.push({ ...row, __key: `base_${index}` }));
      userAdds.forEach(row => rows.push({ ...row, __key: row.__key || `add_${Date.now()}_${Math.random()}` }));
      return rows.filter(row => !userDeletes[row.__key]).map(row => {
        const override = userEdits[row.__key] || {};
        const merged = { ...row, ...override };
        const status = getStatus(merged);
        const total = daysBetween(merged.arrival, merged.out);
        const delayed = total !== null && total > DELAY_LIMIT;
        return { ...merged, status, total, delayed }; 
      });
    }

    function formatDate(value) {
      if (!value) return '—';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function render() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const filterStatus = document.getElementById('filterStatus').value;
      const rows = buildRows().filter(row => {
        const text = [row.bl, row.brand, row.container, row.location].join(' ').toLowerCase();
        if (search && !text.includes(search)) return false;
        if (filterStatus && row.status !== filterStatus) return false;
        return true;
      });

      document.getElementById('totalCount').textContent = rows.length;
      document.getElementById('completedCount').textContent = rows.filter(r => r.status === 'Completed').length;
      document.getElementById('progressCount').textContent = rows.filter(r => r.status === 'In progress').length;
      document.getElementById('delayedCount').textContent = rows.filter(r => r.delayed).length;

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = rows.map(row => `
        <tr>
          <td>${row.bl || ''}</td>
          <td>${row.brand || ''}</td>
          <td>${row.container || ''}</td>
          <td>${row.location || ''}</td>
          <td>${formatDate(row.arrival)}</td>
          <td>${formatDate(row.discharge)}</td>
          <td>${formatDate(row.out)}</td>
          <td><span class="status ${row.status === 'Completed' ? 'completed' : row.status === 'In progress' ? 'progress' : 'awaiting'}">${row.status}</span></td>
          <td>${row.total !== null && row.total !== undefined ? (row.delayed ? `+${row.total - DELAY_LIMIT}d` : 'On time') : '—'}</td>
          <td><div class="row-actions"><button class="btn" data-key="${row.__key}" data-action="edit" type="button">Edit</button></div></td>
        </tr>
      `).join('');

      tbody.querySelectorAll('button[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => openEdit(btn.dataset.key));
      });
    }

    function openModal() {
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function openAdd() {
      document.getElementById('modalTitle').textContent = 'Add container';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('f_bl').value = '';
      document.getElementById('f_container').value = '';
      document.getElementById('f_brand').value = '';
      document.getElementById('f_location').value = '';
      document.getElementById('f_arrival').value = '';
      document.getElementById('f_discharge').value = '';
      document.getElementById('f_out').value = '';
      document.getElementById('f_req').value = '';
      document.getElementById('saveBtn').dataset.mode = 'add';
      openModal();
    }

    function openEdit(key) {
      const row = buildRows().find(r => r.__key === key);
      if (!row) return;
      document.getElementById('modalTitle').textContent = 'Edit container';
      document.getElementById('deleteBtn').style.display = 'inline-block';
      document.getElementById('f_bl').value = row.bl || '';
      document.getElementById('f_container').value = row.container || '';
      document.getElementById('f_brand').value = row.brand || '';
      document.getElementById('f_location').value = row.location || '';
      document.getElementById('f_arrival').value = row.arrival || '';
      document.getElementById('f_discharge').value = row.discharge || '';
      document.getElementById('f_out').value = row.out || '';
      document.getElementById('f_req').value = row.req_status || '';
      document.getElementById('saveBtn').dataset.mode = 'edit';
      document.getElementById('saveBtn').dataset.key = key;
      openModal();
    }

    async function saveRow() {
      const mode = document.getElementById('saveBtn').dataset.mode;
      const keyValue = document.getElementById('saveBtn').dataset.key;
      const payload = {
        bl: document.getElementById('f_bl').value.trim(),
        brand: document.getElementById('f_brand').value.trim(),
        container: document.getElementById('f_container').value.trim(),
        location: document.getElementById('f_location').value.trim(),
        arrival: document.getElementById('f_arrival').value || null,
        discharge: document.getElementById('f_discharge').value || null,
        out: document.getElementById('f_out').value || null,
        req_status: document.getElementById('f_req').value.trim()
      };

      if (!payload.bl && !payload.container) {
        alert('Add BL No. or Container No.');
        return;
      }

      if (mode === 'edit' && keyValue) {
        userEdits[keyValue] = payload;
      } else {
        const newKey = `add_${Date.now()}`;
        userAdds.push({ ...payload, __key: newKey });
      }

      closeModal();
      await persist();
      render();
    }

    async function deleteRow() {
      const keyValue = document.getElementById('saveBtn').dataset.key;
      if (!keyValue) return;

      if (String(keyValue).startsWith('add_')) {
        userAdds = userAdds.filter(item => item.__key !== keyValue);
      } else {
        userDeletes[keyValue] = true;
      }

      closeModal();
      await persist();
      render();
    }

    document.getElementById('pwBtn').addEventListener('click', () => {
      const value = document.getElementById('pwInput').value;
      if (value === 'amica2026') {
        document.getElementById('passwordGate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      } else {
        document.getElementById('pwError').textContent = 'Wrong password';
      }
    });

    document.getElementById('addBtn').addEventListener('click', openAdd);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveBtn').addEventListener('click', saveRow);
    document.getElementById('deleteBtn').addEventListener('click', deleteRow);
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('filterStatus').addEventListener('change', render);

    document.getElementById('modal').addEventListener('click', (event) => {
      if (event.target.id === 'modal') closeModal();
    });

    async function init() {
      readLocal();
      await loadRemote();
      render();
      setSyncStatus('synced');
    }

    init();
  </script>
</body>
</html>
